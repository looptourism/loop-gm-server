<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop HQ – مكتب الوكلاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E8F7; --panel:rgba(255,255,255,.86); --ink:#1B2150; --muted:#59618F;
  --line:rgba(27,33,80,.14); --accent:#3450F0; --field:rgba(27,33,80,.06);
  --s-work:#E8365F; --s-idle:#1FAE66; --s-err:#E08A00; --s-done:#2F7BEA;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10153A; --panel:rgba(22,28,72,.82); --ink:#EAF0FF; --muted:#9DA8DA;
    --line:rgba(150,170,255,.2); --accent:#3EE6FF; --field:rgba(150,170,255,.1);
    --s-work:#FF5A7E; --s-idle:#4BE38A; --s-err:#FFB547; --s-done:#5AA8FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10153A; --panel:rgba(22,28,72,.82); --ink:#EAF0FF; --muted:#9DA8DA;
  --line:rgba(150,170,255,.2); --accent:#3EE6FF; --field:rgba(150,170,255,.1);
  --s-work:#FF5A7E; --s-idle:#4BE38A; --s-err:#FFB547; --s-done:#5AA8FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#overlay{position:fixed;inset:0;pointer-events:none;overflow:hidden}

header{position:fixed;top:0;inset-inline:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;z-index:5;pointer-events:none}
header > *{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:8px;margin-inline-end:auto}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:0}
.brand span{font-size:13px;color:var(--muted)}
.demo{font-size:12px;padding:3px 9px;border-radius:999px;border:1px dashed var(--line);color:var(--muted);background:var(--panel)}
.legend{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.legend b{display:flex;align-items:center;gap:5px;font-weight:500;font-size:13px;padding:2px 6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
.legend em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill:focus-visible,.chip:focus-visible,#send:focus-visible,#task:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.plate{position:absolute;transform:translate(50%,-50%);white-space:nowrap;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.plate i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 7px currentColor}
.bubble{position:absolute;transform:translate(50%,-100%);max-width:180px;font-size:12px;line-height:1.5;padding:5px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .2s}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;bottom:-5px;right:50%;transform:translateX(50%) rotate(45deg);width:8px;height:8px;background:inherit;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}

footer{position:fixed;bottom:0;inset-inline:0;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none}
footer > *{pointer-events:auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);max-width:760px;width:100%;margin-inline:auto}
#task{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:8px 10px}
#task::placeholder{color:var(--muted)}
#task:focus{outline:none}
#send{border:0;background:var(--accent);color:#0B1240;font-weight:700;border-radius:13px;padding:9px 16px}
#logBtn{border:0;background:var(--field);border-radius:13px;padding:9px 12px;font-size:14px}

.sheet{position:fixed;inset-inline:0;bottom:0;z-index:8;max-height:62%;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);transition:transform .28s ease;display:flex;flex-direction:column;max-width:760px;margin-inline:auto}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet header{position:static;padding:0;pointer-events:auto}
.sheet h2{margin:0;font-size:18px}
.sheet .role{color:var(--muted);font-size:14px;margin:2px 0 12px}
.sheet .st{display:flex;align-items:center;gap:6px;font-size:13px}
.sheet .st i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
.sheet ul{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.sheet li{font-size:14px;line-height:1.6;padding:8px 10px;border-radius:12px;background:var(--field)}
.sheet li small{display:block;color:var(--muted);font-size:12px}
.sheet .empty{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.row .x{margin-inline-start:auto}
@media (prefers-reduced-motion: reduce){.sheet,.bubble{transition:none}}

.menu{position:fixed;z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;display:none;flex-direction:column;gap:2px;min-width:210px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,20,.25)}
.menu.open{display:flex}
.menu button{border:0;background:transparent;text-align:right;padding:10px 12px;border-radius:10px;font-size:14px}
.menu button:hover,.menu button:focus-visible{background:var(--field);outline:none}
#approvals{position:fixed;inset-inline:12px;top:120px;z-index:6;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.ap{pointer-events:auto;width:100%;max-width:520px;background:var(--panel);border:1px solid var(--s-err);border-radius:16px;padding:12px 14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:pop .25s ease}
.ap b{font-size:14px;display:flex;align-items:center;gap:6px}
.ap b i{width:8px;height:8px;border-radius:50%;background:var(--s-err);box-shadow:0 0 8px var(--s-err)}
.ap p{margin:4px 0 10px;font-size:14px}
.ap .acts{display:flex;gap:8px}
.ap button{flex:1;border:0;border-radius:11px;padding:9px;font-weight:700}
.ap .ok{background:var(--s-idle);color:#06210F}
.ap .no{background:var(--field)}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.metric{display:flex;flex-direction:column;padding:12px 14px;border-radius:14px;background:var(--field);margin-bottom:10px}
.metric span{font-size:13px;color:var(--muted)}
.metric b{font-size:28px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.ap{animation:none}}

.sheet{overflow-y:auto}
.sheet ul{overflow:visible}
.ap small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tiles .metric{margin:0;padding:10px 12px}
.tiles .metric b{font-size:20px}
.metric span + b + span{margin-top:2px}
.tbl{display:grid;grid-template-columns:1.5fr .8fr .8fr 1.1fr 1fr;gap:8px 8px;font-size:13px;margin-bottom:14px;align-items:center}
.tbl .h{color:var(--muted);font-size:12px}
.tbl .n{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .n i{flex:none;width:8px;height:8px;border-radius:50%}
.tbl .c b{font-weight:500;font-variant-numeric:tabular-nums}
.tbl .c em{display:block;height:4px;border-radius:2px;margin-top:3px;max-width:100%}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
.form input{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.form input:focus{outline:2px solid var(--accent);outline-offset:1px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.go{width:100%;border:0;border-radius:13px;padding:11px;background:var(--accent);color:#0B1240;font-weight:700}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
</style>
</head>
<body>
<canvas id="scene" aria-label="مكتب ثلاثي الأبعاد للوكلاء"></canvas>
<div id="overlay"></div>

<header>
  <div class="brand"><h1>Loop HQ</h1><span>مكتب الوكلاء</span></div>
  <span class="demo">عرض تجريبي</span>
  <div class="legend" aria-label="حالات الموظفين">
    <b style="color:var(--s-work)"><i></i><span style="color:var(--ink)">يشتغل</span><em id="c-working">0</em></b>
    <b style="color:var(--s-idle)"><i></i><span style="color:var(--ink)">فاضي</span><em id="c-idle">0</em></b>
    <b style="color:var(--s-err)"><i></i><span style="color:var(--ink)">خطأ</span><em id="c-error">0</em></b>
    <b style="color:var(--s-done)"><i></i><span style="color:var(--ink)">خلص</span><em id="c-done">0</em></b>
  </div>
  <button class="pill" id="menuBtn" aria-haspopup="true" aria-expanded="false">الإعدادات</button>
</header>

<div class="menu" id="menu" role="menu">
  <button id="themeBtn" role="menuitem"></button>
  <button id="soundBtn" role="menuitem"></button>
  <button id="fxBtn" role="menuitem"></button>
  <button id="hireBtn" role="menuitem">وظّف موظف جديد</button>
  <button id="dashBtn" role="menuitem">لوحة الأداء والتكلفة</button>
  <button id="clearHires" role="menuitem">حذف الموظفين المضافين</button>
  <button id="notifBtn" role="menuitem"></button>
  <button id="resetBtn" role="menuitem">الزاوية الأصلية</button>
</div>

<div id="approvals" aria-live="assertive"></div>

<footer>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <button id="logBtn">شنو صار؟</button>
    <input id="task" placeholder="اكتب مهمة للمدير العام…" autocomplete="off" enterkeyhint="send">
    <button id="send">أرسل</button>
  </div>
</footer>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="grab"></div>
  <div class="row"><h2 id="sTitle"></h2><button class="pill x" id="sClose">إغلاق</button></div>
  <div class="role" id="sRole"></div>
  <div id="sMetric"></div>
  <ul id="sList"></ul>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const V = (x, z) => new THREE.Vector3(x, 0.25, z);
const wait = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.random() * (b - a);
const now = () => new Date().toLocaleTimeString('ar-AE', {hour:'2-digit', minute:'2-digit'});
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const usd = v => '$' + v.toFixed(2);
const dur = ms => { const s = ms / 1000; return s < 60 ? Math.round(s) + ' ث' : Math.floor(s / 60) + ' د ' + Math.round(s % 60) + ' ث'; };
let bag = null;

/* ---------- theme (auto by UAE time) ---------- */
const root = document.documentElement;
let themeMode = 'auto';
function dubaiHour(){
  try { return +new Intl.DateTimeFormat('en-GB', {hour:'numeric', hourCycle:'h23', timeZone:'Asia/Dubai'}).format(new Date()) % 24; }
  catch (e){ return new Date().getHours(); }
}
function resolveTheme(){
  root.dataset.theme = themeMode === 'auto' ? (dubaiHour() >= 6 && dubaiHour() < 18 ? 'light' : 'dark') : themeMode;
}
resolveTheme();
const isNight = () => root.dataset.theme === 'dark';
const statusVar = s => getComputedStyle(root).getPropertyValue({working:'--s-work', idle:'--s-idle', error:'--s-err', done:'--s-done'}[s]).trim();

/* ---------- renderer ---------- */
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
let fx = true;
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, -200, 300);
const target = new THREE.Vector3();
const camOff = new THREE.Vector3(20, 20, 20);
let portrait = false;
const view = {az:Math.PI / 4, el:0.6155, r:34.6};
function setOff(){ camOff.set(view.r * Math.cos(view.el) * Math.sin(view.az), view.r * Math.sin(view.el), view.r * Math.cos(view.el) * Math.cos(view.az)); }
const hemi = new THREE.HemisphereLight(0xffffff, 0x202040, 0.7);
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(16, 28, 12);
sun.target.position.set(2.6, 0, -0.2);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, {left:-21, right:21, top:17, bottom:-17, near:1, far:90});
sun.shadow.bias = -0.0006;
scene.add(hemi, sun, sun.target);

let composer = null;
try {
  if (THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass){
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(512, 512), 0.85, 0.45, 0.6));
  }
} catch (e){ composer = null; }

const lam = c => new THREE.MeshLambertMaterial({color:c});
const glow = (c, o = 1) => new THREE.MeshBasicMaterial({color:c, transparent:o < 1, opacity:o});
function box(w, h, d, mat, x, y, z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = !mat.transparent; m.receiveShadow = true;
  scene.add(m); if (bag) bag.push(m); return m;
}
function cyl(r, h, mat, x, y, z){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 20), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); if (bag) bag.push(m); return m;
}
function ball(r, mat, x, y, z){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
  m.position.set(x, y, z); m.castShadow = true; scene.add(m); if (bag) bag.push(m); return m;
}
function rrect(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
const hex = c => '#' + c.toString(16).padStart(6, '0');

/* ---------- rooms ---------- */
const ROOMS = [
  {id:'meeting', label:'غرفة الاجتماعات', x0:-11, x1:-4.6, z0:-7.5, z1:-1.2, n:0x1B2263, d:0xC9D1F4, a:0x3EE6FF},
  {id:'gm', label:'المدير العام', x0:-4.2, x1:3.4, z0:-7.5, z1:-1.2, n:0x2A2352, d:0xEFE4C6, a:0xF5C451},
  {id:'break', label:'غرفة الاستراحة', x0:3.8, x1:10.6, z0:-7.5, z1:-1.2, n:0x163A33, d:0xD3F1E6, a:0x5CF2C2},
  {id:'sec', label:'السكرتيرة', x0:11.6, x1:16.2, z0:-7.5, z1:-1.2, n:0x2B1F57, d:0xE3D7FA, a:0xB18CFF},
  {id:'fin', label:'المالية', x0:-11, x1:-6.1, z0:1.2, z1:7, n:0x123B3C, d:0xCDEFE0, a:0x4BE38A, front:true},
  {id:'mkt', label:'التسويق', x0:-5.7, x1:-0.8, z0:1.2, z1:7, n:0x3B1742, d:0xF6D4E7, a:0xFF4FA3, front:true},
  {id:'str', label:'الاستراتيجية', x0:-0.4, x1:4.5, z0:1.2, z1:7, n:0x0F3449, d:0xCDEAF6, a:0x3EE6FF, front:true},
  {id:'com', label:'التواصل', x0:4.9, x1:10.6, z0:1.2, z1:7, n:0x3B2515, d:0xF6DFCA, a:0xFF9A3D, front:true},
];
const BOUNDS = {x0:-11.6, x1:16.8, z0:-8, z1:7.6};
const themed = [];
const base = lam(0x151B42); themed.push({mat:base, n:0x151B42, d:0xD6DBF0});
const basePlate = box(1, 0.2, BOUNDS.z1 - BOUNDS.z0, base, 0, 0, (BOUNDS.z0 + BOUNDS.z1) / 2);
function sizeBase(){ basePlate.scale.x = BOUNDS.x1 - BOUNDS.x0; basePlate.position.x = (BOUNDS.x0 + BOUNDS.x1) / 2; }
sizeBase();
const wallMat = lam(0x242C68); themed.push({mat:wallMat, n:0x242C68, d:0xA9B3DA});
const deskMat = lam(0x2E3780); themed.push({mat:deskMat, n:0x2E3780, d:0xFFFFFF});
const deskBody = lam(0x1E255C); themed.push({mat:deskBody, n:0x1E255C, d:0xD9DEF2});
const leaf = lam(0x2FBF8F);
const gold = glow(0xF5C451);

function desk(x, z, w, d, accent){
  box(w, 0.08, d, deskMat, x, 0.95, z);
  box(w * 0.92, 0.6, d * 0.85, deskBody, x, 0.6, z);
  box(Math.min(1, w * 0.5), 0.55, 0.06, glow(accent, 0.85), x, 1.32, z - d * 0.3);
}
function plant(x, z){ box(0.36, 0.4, 0.36, deskBody, x, 0.45, z); ball(0.36, leaf, x, 0.95, z); }

/* live wall screens */
const screens = {};
const screenMats = [];
function makeScreen(id, w, x, y, z){
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.MeshBasicMaterial({map:tex, transparent:true});
  screenMats.push(mat);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 2), mat);
  mesh.position.set(x, y, z); scene.add(mesh); if (bag) bag.push(mesh);
  screens[id] = {cv, ctx:cv.getContext('2d'), tex};
}

const floors = [];

function limb(w, h, d, mat, x, y){

function drawFace(a, ex){
  if (a.ex === ex) return; a.ex = ex;
  const c = a.fctx, col = hex(a.color);
  c.clearRect(0, 0, 128, 64);
  c.fillStyle = '#0E1440'; rrect(c, 2, 2, 124, 60, 26); c.fill();
  c.strokeStyle = col; c.fillStyle = col; c.lineCap = 'round'; c.lineJoin = 'round';
  const line = (x1, y1, x2, y2, lw) => { c.lineWidth = lw; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); };
  const dot = (x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); };
  if (ex === 'calm'){ line(30, 33, 46, 33, 9); line(82, 33, 98, 33, 9); }
  else if (ex === 'focus'){ line(28, 32, 48, 32, 6); line(80, 32, 100, 32, 6); line(28, 22, 48, 25, 4); line(80, 25, 100, 22, 4); }
  else if (ex === 'happy'){ c.lineWidth = 7; c.beginPath(); c.moveTo(28, 38); c.lineTo(38, 26); c.lineTo(48, 38); c.stroke(); c.beginPath(); c.moveTo(80, 38); c.lineTo(90, 26); c.lineTo(100, 38); c.stroke(); }
  else if (ex === 'worried'){ dot(38, 36, 6); dot(90, 36, 6); line(28, 24, 46, 17, 4); line(82, 17, 100, 24, 4); }
  else if (ex === 'think'){ dot(44, 27, 6); dot(96, 27, 6); dot(60, 50, 3); dot(70, 50, 3); dot(80, 50, 3); }
  a.ftex.needsUpdate = true;
}

let actx = null, soundOn = false;
function tone(f, d = 0.12, type = 'sine', v = 0.05, delay = 0){
  if (!soundOn || !actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.value = f;
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(v, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t + d + 0.03);
}
let noiseBuf = null;
function tick(){
  if (!soundOn || !actx) return;
  if (!noiseBuf){ noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.03), actx.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length); }
  const t = actx.currentTime, src = actx.createBufferSource(), bp = actx.createBiquadFilter(), gn = actx.createGain();
  src.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = 2200 + Math.random() * 800; bp.Q.value = 0.9;
  gn.gain.setValueAtTime(0.018, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  src.connect(bp); bp.connect(gn); gn.connect(actx.destination); src.start(t);
}

/* ---------- walking ---------- */
const roomAt = p => ROOMS.find(r => p.x > r.x0 && p.x < r.x1 && p.z > r.z0 && p.z < r.z1);
function walk(a, dest, face, pose = 'stand'){
  return new Promise(res => {
    if (a.done){ const d = a.done; a.done = null; d(); }
    const from = a.grp.position, rf = roomAt(from), rt = roomAt(dest), pts = [];
    if (rf !== rt){
      if (rf){ pts.push(V(rf.door, from.z), V(rf.door, 0)); } else pts.push(V(from.x, 0));
      if (rt){ pts.push(V(rt.door, 0), V(rt.door, dest.z)); }
    }
    pts.push(dest.clone());
    a.path = pts; a.endFace = face; a.nextPose = pose; a.done = res;
  });
}
const goDesk = a => walk(a, a.home, a.face, 'desk');
const claim = a => { a.busy++; };
function release(a){
  a.busy = Math.max(0, a.busy - 1);
  if (!a.busy){
    setState(a, 'idle'); setThink(a, false);
    walk(a, a.rest, a.restFace, a.restPose).then(() => { if (!a.busy && a.restPose === 'stand') bump('break', MET.break.v + 1); });
  }
}

const short = t => t.length > 34 ? t.slice(0, 34) + '…' : t;
function route(t){
  if (/اجتماع|الكل|الجميع|ناقشوا/.test(t)) return 'meeting';
  for (const a of Object.values(A)) if (a.hire && (t.includes(a.name) || a.role.split(/\s+/).some(w => w.length > 2 && t.includes(w)))) return a.id;
  if (/مالي|دفع|مصاريف|مصروف|فاتور|ميزاني|رسوم|دفتر|سدد|سدّد/.test(t)) return 'fin';
  if (/تسويق|اعلان|إعلان|محتوى|انستقرام|إنستقرام|ريلز|بوست|حملة|نشر|انشر/.test(t)) return 'mkt';

  if (/موعد|تذكير|ذكرني|إحاطة|احاطة|جدول|سكرتير/.test(t)) return 'sec';

async function work(d, text, where, needs){
  await goDesk(d);

  setState(d, 'working', short(text));
  await wait(rnd(3500, 6000));
  if (Math.random() < 0.15){

    await wait(2600);
    setState(d, 'working', 'يعيد المحاولة');
    await wait(2200);
  }
  if (needs){
    const detail = APPROVAL[where];
    setState(d, 'working', 'ينتظر موافقتك'); setThink(d, true);
    log(where, 'طلب موافقتك: ' + detail);
    waiting++;
    await walk(d, WAIT[DEPTS.indexOf(d) % 3], Math.PI, 'stand');
    const ok = await askApproval(d, detail);

}
function runTask(text, user = true){
  const where = route(text);

  if (where === 'meeting') return runMeeting(text);
  const d = A[where], gm = A.gm;
  const needs = (where === 'fin' && /دفع|سدد|سدّد|حوّل|حول/.test(text)) || (where === 'mkt' && /نشر|انشر/.test(text)) || (user && (where === 'fin' || where === 'mkt') && Math.random() < 0.2);
  d.queue = d.queue.then(async () => {
    claim(d);
    if (where === 'sec'){

    }

    await goDesk(gm);
    setThink(gm, false);

    log('gm', 'حوّل المهمة لـ' + d.name); spend(gm, rnd(0.005, 0.02));

    say(d, 'استلمت المهمة'); say(gm, short(text));
    await wait(1700);

}
function runMeeting(topic){

    $('sTitle').textContent = 'لوحة الأداء والتكلفة';
    $('sRole').textContent = 'عند المدير العام: استهلاك كل وكيل وأداؤه';
    M.innerHTML = dashHTML(); L.innerHTML = ''; return;
  }
  const r = sel.kind === 'agent' ? R[sel.ref.id] : sel.ref;
  const a = sel.kind === 'agent' ? sel.ref : (r ? A[r.id] : null);
  if (!r || (sel.kind === 'agent' && !A[a.id])) return closeSheet();
  $('sTitle').innerHTML = esc(sel.kind === 'agent' ? a.name : r.label) + (a ? stBadge(a) : '');
  if (a){
    $('sRole').textContent = a.role;
    let h = a.id === 'gm' ? dashHTML() : metricHTML(a.id) + statsHTML(a);
    if (a.hire) h += '<button class="pill" id="fireBtn">إنهاء خدمة</button><p class="hint" id="fireMsg"></p>';
    M.innerHTML = h;
    if (a.hire) $('fireBtn').onclick = () => { if (fire(a)) closeSheet(); else $('fireMsg').textContent = 'مشغول الحين، جرّب بعد ما يخلص مهمته.'; };
    L.innerHTML = a.log.length ? a.log.map(e => li(e)).join('') : '<li class="empty">ما عنده مهام منجزة للحين.</li>';
    return;
  }
  M.innerHTML = metricHTML(r.id);
  if (r.id === 'break'){
    const here = Object.values(A).filter(x => x.state === 'idle' && roomAt(x.grp.position) === r);
    $('sRole').textContent = here.length ? 'يرتاحون الحين: ' + here.map(x => x.name).join('، ') : 'ما فيه أحد يرتاح الحين، الكل مشغول';
    L.innerHTML = '';
  } else {
    $('sRole').textContent = 'آخر الاجتماعات وخلاصاتها';
    const ms = LOG.filter(e => /اجتماع/.test(e.text));
    L.innerHTML = ms.length ? ms.map(e => li(e)).join('') : '<li class="empty">ما صار اجتماع للحين. جرّب: اجتماع: خطة عروض ديسمبر</li>';
  }
}
function closeSheet(){ $('sheet').classList.remove('open'); sel = null; }
function openSheet(kind, ref){ sel = {kind, ref}; renderSheet(); $('sheet').classList.add('open'); }
$('sClose').onclick = closeSheet;
$('logBtn').onclick = () => openSheet('log');

/* settings menu */
const menu = $('menu');
function closeMenu(){ menu.classList.remove('open'); $('menuBtn').setAttribute('aria-expanded', 'false'); }
$('menuBtn').onclick = e => {
  e.stopPropagation();
  if (menu.classList.contains('open')) return closeMenu();
  const r = $('menuBtn').getBoundingClientRect();
  menu.style.top = (r.bottom + 6) + 'px'; menu.style.left = Math.max(8, r.left) + 'px';
  menu.classList.add('open'); $('menuBtn').setAttribute('aria-expanded', 'true');
};
document.addEventListener('pointerdown', e => { if (!menu.contains(e.target) && e.target !== $('menuBtn')) closeMenu(); });
function labels(){
  $('themeBtn').textContent = 'المظهر: ' + ({auto:'تلقائي حسب وقت الإمارات', light:'نهاري', dark:'ليلي'}[themeMode]);
  $('soundBtn').textContent = 'الصوت: ' + (soundOn ? 'مشغّل' : 'مطفي');
  $('fxBtn').textContent = 'التوهج والظلال: ' + (fx ? 'مشغّلة' : 'مطفية');
  $('notifBtn').textContent = 'إشعارات الجهاز: ' + (!window.Notification ? 'غير مدعومة هنا' : Notification.permission === 'granted' ? 'مفعّلة' : Notification.permission === 'denied' ? 'مرفوضة' : 'فعّلها');
}
$('themeBtn').onclick = () => { themeMode = {auto:'light', light:'dark', dark:'auto'}[themeMode]; resolveTheme(); applyTheme(); labels(); };
$('soundBtn').onclick = () => {
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e){} }
  if (actx && actx.state === 'suspended') actx.resume();
  soundOn = !soundOn && !!actx; labels(); if (soundOn) SFX.done();
};
$('fxBtn').onclick = () => {
  fx = !fx; renderer.shadowMap.enabled = fx;
  scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
  labels();
};
$('resetBtn').onclick = () => { fit(); closeMenu(); };
$('hireBtn').onclick = () => { closeMenu(); openSheet('hire'); };
$('dashBtn').onclick = () => { closeMenu(); openSheet('stats'); };
const tryFire = a => { if (A[a.id] && !fire(a)) setTimeout(() => tryFire(a), 2000); };
$('clearHires').onclick = () => { closeMenu(); Object.values(A).filter(a => a.hire).forEach(tryFire); };
$('notifBtn').onclick = () => { if (!window.Notification) return labels(); try { Notification.requestPermission().then(labels, labels); } catch (e){ labels(); } };

function applyTheme(){
  const n = isNight();
  scene.background = new THREE.Color(n ? 0x10153A : 0xE4E8F7);
  themed.forEach(t => t.mat.color.set(n ? t.n : t.d));
  logoMat.color.set(n ? 0xF5C451 : 0x1B2150);
  screenMats.forEach(mt => mt.color.set(n ? 0xB4B4B4 : 0xFFFFFF));
  hemi.intensity = n ? 0.6 : 1.0; sun.intensity = n ? 0.6 : 0.55;
  Object.values(A).forEach(a => a.orb.material.color.set(statusVar(a.state)));
  counts();
}
setInterval(() => { if (themeMode === 'auto'){ const before = root.dataset.theme; resolveTheme(); if (before !== root.dataset.theme) applyTheme(); } }, 60000);

/* ---------- camera fit, orbit, zoom, tap ---------- */
const vRight = new THREE.Vector3(), vUp = new THREE.Vector3(), tmp = new THREE.Vector3();
const size = () => ({W:canvas.clientWidth || innerWidth, H:canvas.clientHeight || innerHeight});
function placeCamera(){
  camera.position.copy(target).add(camOff); camera.lookAt(target);
  camera.updateMatrixWorld();
  vRight.setFromMatrixColumn(camera.matrixWorld, 0);
  vUp.setFromMatrixColumn(camera.matrixWorld, 1);
}
function fit(){
  const {W, H} = size(), asp = W / H, HH = 10;
  renderer.setSize(W, H, false);
  if (composer) composer.setSize(W, H);
  portrait = asp < 0.9;
  view.az = portrait ? 1.31 : Math.PI / 4; view.el = portrait ? 1.05 : 0.6155; setOff();
  camera.left = -HH * asp; camera.right = HH * asp; camera.top = HH; camera.bottom = -HH;
  camera.zoom = 1; camera.updateProjectionMatrix();
  target.set((BOUNDS.x0 + BOUNDS.x1) / 2, 0, (BOUNDS.z0 + BOUNDS.z1) / 2);
  placeCamera();
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const x of [BOUNDS.x0, BOUNDS.x1]) for (const z of [BOUNDS.z0, BOUNDS.z1]) for (const y of [0, 2.3]){
    tmp.set(x, y, z).project(camera);
    x0 = Math.min(x0, tmp.x); x1 = Math.max(x1, tmp.x); y0 = Math.min(y0, tmp.y); y1 = Math.max(y1, tmp.y);
  }
  const top = document.querySelector('header').getBoundingClientRect().bottom + 6;
  const bot = document.querySelector('footer').getBoundingClientRect().top - 6;
  $('approvals').style.top = top + 'px';
  const ew = (x1 - x0) / 2 * W, eh = (y1 - y0) / 2 * H;
  const z = Math.max(0.3, Math.min(3, Math.min((W - 16) / ew, (bot - top) / eh)));
  const mcx = (x0 + x1) / 2, mcy = (y0 + y1) / 2;
  const dxpx = -mcx * z * W / 2;
  const dypx = (top + bot) / 2 - (H / 2 - mcy * z * H / 2);
  const wpx = (camera.right - camera.left) / z / W;
  target.addScaledVector(vRight, -dxpx * wpx).addScaledVector(vUp, dypx * wpx);
  camera.zoom = z; camera.updateProjectionMatrix();
  placeCamera();
}
new ResizeObserver(fit).observe(canvas);
addEventListener('orientationchange', () => setTimeout(fit, 300));

const ptrs = new Map(); let downAt = null, moved = false, pinch0 = 0, zoom0 = 1, mid0 = null;
const midOf = () => { const [p, q] = [...ptrs.values()]; return {x:(p.x + q.x) / 2, y:(p.y + q.y) / 2, d:Math.hypot(p.x - q.x, p.y - q.y)}; };
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1){ downAt = {x:e.clientX, y:e.clientY}; moved = false; }
  if (ptrs.size === 2){ mid0 = midOf(); pinch0 = mid0.d; zoom0 = camera.zoom; moved = true; }
});
canvas.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId), cur = {x:e.clientX, y:e.clientY};
  ptrs.set(e.pointerId, cur);
  if (ptrs.size === 2){
    const mm = midOf();
    camera.zoom = Math.min(4, Math.max(0.3, zoom0 * mm.d / pinch0));
    camera.updateProjectionMatrix();
    const wpx = (camera.right - camera.left) / camera.zoom / size().W;
    target.addScaledVector(vRight, -(mm.x - mid0.x) * wpx).addScaledVector(vUp, (mm.y - mid0.y) * wpx);
    mid0 = mm; placeCamera(); return;
  }
  if (downAt && Math.hypot(cur.x - downAt.x, cur.y - downAt.y) > 6) moved = true;
  if (!moved) return;
  view.az = Math.min(1.9, Math.max(-0.35, view.az - (cur.x - prev.x) * 0.008));
  view.el = Math.min(1.35, Math.max(0.3, view.el + (cur.y - prev.y) * 0.006));
  setOff(); placeCamera();
});
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
canvas.addEventListener('pointerup', e => {
  ptrs.delete(e.pointerId);
  if (!moved && ptrs.size === 0){
    const r = canvas.getBoundingClientRect();
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickables)[0];
    if (hit) return openSheet('agent', hit.object.userData.agent);
    const fh = ray.intersectObjects(floors)[0];
    if (fh) fh.object.userData.room.slot ? openSheet('hire') : openSheet('room', fh.object.userData.room);
  }
});
canvas.addEventListener('pointercancel', e => ptrs.delete(e.pointerId));
canvas.addEventListener('dblclick', fit);
canvas.addEventListener('wheel', e => { e.preventDefault(); camera.zoom = Math.min(4, Math.max(0.3, camera.zoom * (e.deltaY > 0 ? 0.92 : 1.08))); camera.updateProjectionMatrix(); }, {passive:false});

/* ---------- loop ---------- */
function project(v, el, W, H){
  tmp.copy(v).project(camera);
  el.style.right = ((1 - (tmp.x * 0.5 + 0.5)) * W) + 'px';
  el.style.top = ((-tmp.y * 0.5 + 0.5) * H) + 'px';
}
let last = performance.now(), keyT = 0;
function frame(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const {W, H} = size();
  let typing = false;
  Object.values(A).forEach((a, i) => {
    const p = a.grp.position, [lL, lR] = a.legs, [aL, aR] = a.arms;
    let gy = 0.25;
    if (a.path.length){
      const goal = a.path[0], dx = goal.x - p.x, dz = goal.z - p.z, dist = Math.hypot(dx, dz), step = 3.2 * dt;
      if (dist <= step){
        p.x = goal.x; p.z = goal.z; a.path.shift();
        if (!a.path.length){ a.grp.rotation.y = a.endFace; a.pose = a.nextPose; const d = a.done; a.done = null; d && d(); }
      } else { p.x += dx / dist * step; p.z += dz / dist * step; a.grp.rotation.y = Math.atan2(dx, dz); a.pose = 'walk'; }
    }
    if (a.pose === 'walk'){
      a.wp += dt * 11; const sw = Math.sin(a.wp);
      lL.rotation.x = sw * 0.6; lR.rotation.x = -sw * 0.6; aL.rotation.x = -sw * 0.5; aR.rotation.x = sw * 0.5;
      gy += Math.abs(Math.cos(a.wp)) * 0.05;
    } else if (a.pose === 'sit'){
      lL.rotation.x = lR.rotation.x = -1.45; aL.rotation.x = aR.rotation.x = -0.35;
      gy = 0.17;
    } else if (a.pose === 'desk' && (a.state === 'working' || a.state === 'error')){
      lL.rotation.x = lR.rotation.x = 0;
      aL.rotation.x = -1.0 + Math.sin(t / 45) * 0.12; aR.rotation.x = -1.0 - Math.sin(t / 45) * 0.12;
      typing = true;
    } else if (a.pose === 'desk' && a.state === 'done'){
      lL.rotation.x = lR.rotation.x = 0;
      aL.rotation.x = aR.rotation.x = -2.6 + Math.sin(t / 120) * 0.25;
      gy += Math.abs(Math.sin(t / 160)) * 0.08;
    } else {
      lL.rotation.x = lR.rotation.x = 0;
      aL.rotation.x = Math.sin(t / 700 + a.phase) * 0.06; aR.rotation.x = -aL.rotation.x;
    }
    p.y = gy;
    a.body.scale.y = 1 + Math.sin(t / 600 + a.phase) * 0.015;
    a.orb.position.y = 1.95 + Math.sin(t / 400 + a.phase) * 0.04;
    const txt = a.temp || (a.state !== 'idle' ? a.text : '');
    if (a.bub.textContent !== txt) a.bub.textContent = txt;
    a.bub.classList.toggle('on', !!txt);
    project(tmp.set(p.x, 2.25, p.z), a.bub, W, H);
  });
  if (soundOn && typing){ keyT += dt; if (keyT > 0.13){ keyT = 0; if (Math.random() < 0.45) SFX.key(); } }
  waitRing.material.opacity = waiting ? 0.45 + Math.sin(t / 220) * 0.3 : 0;
  plates.forEach(pl => project(portrait ? pl.r.plateP : pl.r.plateL, pl.el, W, H));
  if (composer && fx && isNight()) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- hiring ---------- */
const PALETTE = [0x5C8DFF, 0xFF6B6B, 0x22D3A6, 0xFFD166, 0xC77DFF, 0x4DD0E1, 0xFF8FAB, 0x9BE15D];
const HKEY = 'loop-hq-hires-v1';
let hires = [], ph = null;
const persist = () => { try { localStorage.setItem(HKEY, JSON.stringify(hires)); } catch (e){} };
const mixHex = (c, to, k) => new THREE.Color(c).lerp(new THREE.Color(to), k).getHex();
function freeSlot(){ for (let i = 0; i < HIRE_SLOTS.length; i++) if (!hires.some(h => h.slot === i)) return i; return -1; }
function updateBounds(){
  let mx = 16.8;
  hires.forEach(h => mx = Math.max(mx, HIRE_SLOTS[h.slot].x1 + 0.6));
  const f = freeSlot(); if (f >= 0) mx = Math.max(mx, HIRE_SLOTS[f].x1 + 0.6);
  BOUNDS.x1 = mx; sizeBase();
}
function clearPh(){
  if (!ph) return;
  ph.objs.forEach(o => scene.remove(o)); ph.plate.el.remove();
  plates.splice(plates.indexOf(ph.plate), 1); floors.splice(floors.indexOf(ph.floor), 1); ph = null;
}
function placePh(){
  clearPh(); updateBounds();
  const i = freeSlot(); if (i < 0) return;
  const {x0, x1} = HIRE_SLOTS[i], z0 = 1.2, z1 = 7, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  bag = [];
  const edge = glow(0x9DA8DA, 0.4);
  const fl = box(x1 - x0, 0.06, z1 - z0, glow(0x9DA8DA, 0.07), cx, 0.27, cz);
  box(x1 - x0, 0.04, 0.06, edge, cx, 0.31, z0); box(x1 - x0, 0.04, 0.06, edge, cx, 0.31, z1);
  box(0.06, 0.04, z1 - z0, edge, x0, 0.31, cz); box(0.06, 0.04, z1 - z0, edge, x1, 0.31, cz);
  const objs = bag; bag = null;
  const r = {id:'slot', label:'+ وظّف موظف', x0, x1, z0, z1, cx, cz, slot:true, plateL:new THREE.Vector3(x1 - 1.3, 0.3, z1 + 0.35), plateP:new THREE.Vector3(x1 + 0.25, 0.3, cz)};
  fl.userData.room = r; floors.push(fl);
  const plate = makePlate(r); plates.push(plate);
  ph = {objs, plate, floor:fl};
}
function hire(h, fresh = true){
  if (h.slot == null) h.slot = freeSlot();
  if (h.slot < 0 || h.slot >= HIRE_SLOTS.length) return false;
  const sl = HIRE_SLOTS[h.slot], id = 'h' + h.slot;
  const r = {id, label:h.name, x0:sl.x0, x1:sl.x1, z0:1.2, z1:7, n:mixHex(h.color, 0x10153A, 0.72), d:mixHex(h.color, 0xFFFFFF, 0.78), a:h.color, front:true, hire:true};
  clearPh();
  bag = []; buildRoom(r); deptFurniture(r); r.objs = bag; bag = null;
  ROOMS.push(r); R[id] = r;
  MET[id] = {t:'مهام منجزة اليوم', v:0, f:v => fmt(v), h:[0, 0]};
  RESULTS[id] = ['خلصت المهمة وأرسلت لك التفاصيل', 'جهّزت المطلوب وحفظته في الملفات', 'راجعت الموضوع ورفعت لك ملاحظاتي'];
  const a = makeAgent({id, name:h.name, role:h.role, color:h.color, hire:true}, REST_X[h.slot]);
  a.slot = h.slot;
  plates.push(makePlate(r));
  hires.push(h);
  drawScreen(id); drawCost();
  placePh(); fit(); applyTheme();
  if (fresh){
    persist();
    a.grp.position.copy(V(BOUNDS.x1 - 0.3, 0));
    walk(a, a.rest, a.restFace, a.restPose);
    log('gm', 'انضم ' + h.name + ' للفريق: ' + h.role);
    say(a, 'هلا! أنا ' + h.name, 3200);
  }
  return true;
}
function fire(a){
  if (a.busy) return false;
  const r = R[a.id];
  r.objs.forEach(o => scene.remove(o));
  scene.remove(a.grp); a.bub.remove();
  const p = plates.find(x => x.r === r); if (p){ p.el.remove(); plates.splice(plates.indexOf(p), 1); }
  ROOMS.splice(ROOMS.indexOf(r), 1); delete R[a.id];
  const fl = floors.find(f => f.userData.room === r); if (fl) floors.splice(floors.indexOf(fl), 1);
  for (let i = pickables.length - 1; i >= 0; i--) if (pickables[i].userData.agent === a) pickables.splice(i, 1);
  delete A[a.id]; delete MET[a.id];
  hires = hires.filter(h => h.slot !== a.slot); persist();
  log('gm', 'أنهى خدمة ' + a.name);
  placePh(); fit(); counts(); drawCost();
  return true;
}
try { (JSON.parse(localStorage.getItem(HKEY) || '[]') || []).forEach(h => { if (h && h.name && h.role) hire({name:String(h.name).slice(0, 18), role:String(h.role).slice(0, 60), color:+h.color || PALETTE[0], slot:+h.slot}, false); }); } catch (e){}
placePh();

labels(); fit(); applyTheme();
requestAnimationFrame(frame);

/* ambient demo activity */
setTimeout(() => runTask('جهّز إحاطة الصباح', false), 1500);
setTimeout(() => runTask('اقترح محتوى عن باقات العمرة', false), 3000);
setInterval(() => {
  if (Date.now() - lastUser > 20000 && Math.random() < 0.55) runTask(pick(AMBIENT), false);
}, 9000);
setInterval(() => bump('com', MET.com.v + 1), 15000);
})();
