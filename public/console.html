<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080F">
<title>Loop — مجلس الإدارة الرقمي · v9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* =========================================================
   Loop — مجلس الإدارة الرقمي
   ملف واحد: التصميم + الواجهة. البيانات حالياً تجريبية (Mock)
   واربطها بالسيرفر من كائن API في أسفل الملف.
   ========================================================= */
:root{
  --bg:#07080F; --surface:rgba(255,255,255,.035); --surface-2:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.14);
  --text:#ECEEF6; --text-strong:#FFFFFF; --muted:#A3A9C2; --dim:#8C92AB;
  --accent:#A594FF; --accent-ink:#0B0A1A; --accent-soft:rgba(165,148,255,.14); --accent-line:rgba(165,148,255,.38);
  --accent2:#5BD9F5; --accent2-soft:rgba(91,217,245,.12); --accent2-line:rgba(91,217,245,.32);
  --amber:#F5B85B; --amber-soft:rgba(245,184,91,.13); --amber-line:rgba(245,184,91,.38);
  --coral:#FF7A85; --coral-soft:rgba(255,122,133,.1); --coral-line:rgba(255,122,133,.4);
  --mint:#7CF2C4; --mint-soft:rgba(124,242,196,.12);
  --node-bg:#0F1017;
  --r-lg:24px; --r-md:18px; --r-sm:14px;
  --font:'IBM Plex Sans Arabic','Noto Sans Arabic',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.ltr{direction:ltr;unicode-bidi:isolate}
svg.i{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.s16{width:16px;height:16px} svg.i.s14{width:14px;height:14px} svg.i.s18{width:18px;height:18px}

/* ---------- layout ---------- */
.app{min-height:100vh;display:flex;justify-content:center;position:relative;overflow-x:hidden}
.app::before{content:"";position:fixed;top:-180px;left:50%;width:620px;height:460px;margin-left:-310px;border-radius:50%;background:radial-gradient(closest-side,rgba(124,108,255,.18),rgba(124,108,255,0));pointer-events:none;z-index:0}
.sidebar{display:none}
.main{position:relative;z-index:1;width:100%;max-width:460px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 104px);display:flex;flex-direction:column;gap:16px}
.main.has-composer{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 180px)}
.side-chat{display:none}

/* ---------- common pieces ---------- */
.card{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.h1{margin:0;font-size:20px;font-weight:700;color:var(--text-strong)}
.h2{margin:0;font-size:15px;font-weight:700;color:var(--text-strong)}
.sub{font-size:12px;color:var(--muted)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}
.icon-btn{position:relative;width:44px;height:44px;flex-shrink:0;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:#C7CBDD;display:inline-flex;align-items:center;justify-content:center;padding:0;text-decoration:none}
.icon-btn.amber{border-color:var(--amber-line);background:var(--amber-soft);color:var(--amber)}
.icon-btn .badge{position:absolute;top:-4px;left:-4px}
.badge{min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--coral);border:2px solid var(--bg);color:#1A0A0C;font:600 10px/1 var(--mono);display:inline-flex;align-items:center;justify-content:center}
.btn{height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line-2);background:transparent;color:#D9DCE8;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 24px rgba(124,108,255,.32)}
.btn.outline{border-color:var(--accent-line);color:var(--accent)}
.btn.danger{border-color:var(--coral-line);color:var(--coral)}
.btn.coral{border:none;background:var(--coral);color:#1A0A0C;font-weight:700}
.btn.amber{border:none;background:var(--amber);color:#2A1806;font-weight:700}
.btn.block{width:100%;height:52px;border-radius:16px;font-size:15px}
.chip{flex-shrink:0;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:#C7CBDD;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:rgba(165,148,255,.18);border-color:rgba(165,148,255,.45);color:#fff;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#C7CBDD;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.live{animation:blink 1.8s ease-in-out infinite}
.seg{display:grid;gap:4px;padding:4px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{height:40px;border-radius:12px;border:none;background:transparent;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:rgba(165,148,255,.18);color:#fff;font-weight:600}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-radius:14px;background:var(--surface-2);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stat b{font:600 20px/1.3 var(--mono);color:#fff}
.stat span{font-size:11px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between}
.brand-logo{display:block;width:150px;height:auto;margin:0 auto}
.back-head{display:flex;align-items:center;gap:12px}

/* ---------- orb ---------- */
.orb{border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--accent2) 22%,var(--accent) 58%,#2A1F6B 100%);box-shadow:0 0 26px rgba(124,108,255,.55)}
.orb-wrap{position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.orb-wrap .ring{position:absolute;inset:18%;border-radius:50%;border:1px solid var(--accent);animation:pulse 2.6s ease-out infinite}
.orb-wrap .ring.r2{border-color:var(--accent2);animation-delay:1.3s}
.offline .orb{filter:grayscale(.85);opacity:.55}
.offline .ring{display:none}

/* ---------- network ---------- */
.net{position:relative;width:100%;max-width:380px;aspect-ratio:322/285;align-self:center}
.net svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.net .core{position:absolute;width:80px;height:80px;transform:translate(50%,-50%)}
.node{position:absolute;width:76px;transform:translate(50%,-22px);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:0;color:inherit;text-decoration:none}
.node .disc{position:relative;width:44px;height:44px;border-radius:50%;background:var(--node-bg);border:1px solid var(--accent-line);color:var(--accent);display:flex;align-items:center;justify-content:center}
.node .cnt{position:absolute;top:-5px;left:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#25233F;border:2px solid var(--node-bg);color:#fff;font:600 10px/1 var(--mono);display:flex;align-items:center;justify-content:center}
.node .lbl{font-size:11px;line-height:1.4;color:#D9DCE8;background:var(--node-bg);padding:0 4px;border-radius:4px;white-space:nowrap}
.node.out .disc{border-color:var(--accent2);color:var(--accent2);box-shadow:0 0 18px rgba(91,217,245,.55)}
.node.out .cnt{background:var(--accent2);color:var(--bg)}
.node.in .disc{border-color:var(--accent);box-shadow:0 0 18px rgba(165,148,255,.6)}
.node.in .cnt{background:var(--accent);color:var(--bg)}
.node.out .lbl,.node.in .lbl{color:#fff}
.node.idle .disc{border-color:var(--line-2);color:var(--dim)} .node.idle .cnt{background:#1A1C28;color:var(--muted)} .node.idle .lbl{color:var(--dim)}
.node.fail .disc{border-color:var(--coral);color:var(--coral);box-shadow:0 0 18px rgba(255,122,133,.45)} .node.fail .cnt{background:var(--coral);color:var(--bg)}
.node.paused .disc{border-color:var(--line-2);color:var(--muted)} .node.paused .cnt{background:#25273A;color:#C7CBDD}
line.flow{stroke-dasharray:3 7;animation:flow 1.8s linear infinite}
line.flow-fast{stroke-dasharray:6 6;animation:flow .8s linear infinite}
.feed{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03)}
.feed div{display:flex;align-items:center;gap:8px;font-size:13px;color:#D9DCE8;line-height:1.6}
.feed b{color:#fff;font-weight:600}
.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--coral-soft);border:1px solid var(--coral-line)}
.alert .tile{background:rgba(255,122,133,.16);color:var(--coral)}
.fail-box{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,122,133,.07);border:1px solid rgba(255,122,133,.25)}
.teaser{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--amber-line);background:rgba(245,184,91,.06);text-decoration:none;color:inherit}
.teaser .tile{background:var(--amber-soft);color:var(--amber)}

/* ---------- المكتب (داخل اللوحة) ---------- */
.main.office{max-width:none;padding:0;gap:0}
.office-frame{display:block;width:100%;border:0;background:var(--bg,#10153A);height:calc(100dvh - env(safe-area-inset-bottom,0px) - 84px)}
@media (min-width:1024px){ body.office-on .side-chat{display:none} .main.office{flex:1;min-width:0} .office-frame{height:calc(100dvh - 40px);border-radius:26px;border:1px solid var(--line)} }

/* ---------- bottom nav ---------- */
.tabbar{position:fixed;z-index:20;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);width:calc(100% - 32px);max-width:428px;border-radius:24px;border:1px solid rgba(255,255,255,.1);background:rgba(18,19,32,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:6px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tabbar a{height:56px;border-radius:18px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;text-decoration:none}
.tabbar a[aria-current="page"]{background:rgba(165,148,255,.16);color:var(--accent);font-weight:600}

/* ---------- chat ---------- */
.chat-head{display:flex;align-items:center;gap:12px;padding:8px;border-radius:22px;border:1px solid var(--line);background:var(--surface)}
.msgs{display:flex;flex-direction:column;gap:14px}
.msg-me{align-self:flex-end;max-width:80%;padding:12px 14px;border-radius:18px 18px 18px 6px;background:rgba(165,148,255,.16);border:1px solid rgba(165,148,255,.3);font-size:14px;line-height:1.7;color:#fff;white-space:pre-wrap;word-break:break-word}
.msg-me img{display:block;max-width:180px;border-radius:12px}
.msg-gm{align-self:flex-start;width:92%;display:flex;flex-direction:column;gap:8px}
.gm-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#D9DCE8}
.bubble{padding:14px;border-radius:6px 18px 18px 18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);font-size:14px;line-height:1.75;color:var(--text);white-space:pre-wrap}
.deleg{border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.03);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.deleg .tile{width:32px;height:32px;border-radius:10px}
.st-done{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--accent);flex-shrink:0}
.st-work{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--accent2);flex-shrink:0}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid rgba(91,217,245,.25);border-top-color:var(--accent2);animation:spin .9s linear infinite;flex-shrink:0}
.typing{align-self:flex-start;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:6px 18px 18px 18px;background:rgba(91,217,245,.06);border:1px solid rgba(91,217,245,.2);font-size:12px;color:#C7CBDD}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--accent2);display:inline-block;animation:dot 1.2s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer-dock{position:fixed;z-index:19;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:calc(100% - 32px);max-width:428px;display:flex;flex-direction:column;gap:8px}
.composer{display:flex;align-items:center;gap:6px;padding:6px;border-radius:22px;border:1px solid var(--accent-line);background:rgba(18,19,32,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.composer input[type=text]{flex:1;min-width:0;height:44px;border:none;outline:none;background:transparent;color:#fff;font-size:15px;padding:0 6px}
.composer .send{width:44px;height:44px;border-radius:16px;border:none;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.composer .ghost{width:44px;height:44px;border-radius:16px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.composer .ghost.mic-on{color:var(--coral);background:var(--coral-soft);animation:pulse-mic 1.4s ease-in-out infinite}
@keyframes pulse-mic{0%,100%{opacity:1}50%{opacity:.55}}
.composer .ghost.mic-ready{color:var(--mint);background:rgba(52,211,153,.14);box-shadow:0 0 0 2px rgba(52,211,153,.35)}
.composer.amber{border-color:var(--amber-line)} .composer.amber .send{background:var(--amber);color:#2A1806}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;font-size:13px}
.kv span:first-child{color:var(--muted)} .kv span:last-child{color:var(--text);font-weight:500;text-align:left}
.kvbox{display:flex;flex-direction:column;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.035)}
.tag-auto{font-size:10px;font-weight:600;color:var(--accent);padding:2px 6px;border-radius:6px;background:var(--accent-soft);margin-inline-start:6px}

/* ---------- departments ---------- */
.dept-card{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit}
.dept-card.hot{border-color:var(--accent2-line);box-shadow:0 0 0 4px rgba(91,217,245,.05),0 0 28px rgba(91,217,245,.08)}
.dept-card.hot .tile{background:var(--accent2-soft);color:var(--accent2)}
.dept-idle{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;border:1px dashed rgba(255,255,255,.13);background:rgba(255,255,255,.015)}
.dept-idle .tile{background:var(--surface-2);color:var(--muted)}
.status{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:#D9DCE8}
.status.work{color:var(--accent2);background:var(--accent2-soft);border-color:var(--accent2-line)}
.status.done{color:var(--accent);background:rgba(165,148,255,.1);border-color:var(--accent-line)}
.status.fail{color:var(--coral);background:var(--coral-soft);border-color:var(--coral-line)}
.taskline{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03)}
.taskline span:first-child{font-size:11px;color:var(--dim)} .taskline span:last-child{font-size:13px;color:var(--text)}
.hist{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}

/* ---------- secretary ---------- */
.sec-avatar{width:44px;height:44px;border-radius:15px;flex-shrink:0;background:linear-gradient(140deg,#FFE2A8 0%,var(--amber) 45%,#B9732A 100%);color:#2A1806;display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(245,184,91,.35)}
.brief{border-radius:var(--r-lg);border:1px solid var(--amber-line);background:rgba(245,184,91,.05);padding:18px;display:flex;flex-direction:column;gap:16px}
.num{width:24px;height:24px;border-radius:8px;flex-shrink:0;background:var(--amber-soft);color:var(--amber);font:600 12px/1 var(--mono);display:flex;align-items:center;justify-content:center}
.chip.amber{border-color:rgba(245,184,91,.3);background:rgba(245,184,91,.06);color:#F3DDB7}

/* ---------- settings ---------- */
.group{border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:4px 0}
.group > * + *{border-top:1px solid rgba(255,255,255,.06)}
.set-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px}
.switch{width:52px;height:44px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.switch span{position:relative;width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.14);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"] span{background:var(--accent)}
.switch[aria-checked="true"] span::after{left:22px}
.meter{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}

/* ---------- accounting ---------- */
.catbar{display:flex;gap:3px;height:10px;border-radius:5px;overflow:hidden}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px}
.pay{border-radius:var(--r-md);border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.pay.open{border-color:var(--accent-line);background:rgba(255,255,255,.045);box-shadow:0 0 0 4px rgba(124,108,255,.06)}
.pay > button{width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 14px;border:none;background:transparent;text-align:right}
.pay .chev{color:var(--dim);display:flex;transition:transform .2s}
.pay.open .chev{transform:rotate(180deg)}
.pay-detail{margin:0 14px 14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);display:flex;flex-direction:column}
.amt{display:inline-flex;align-items:baseline;gap:4px;flex-shrink:0}
.amt b{font:600 15px/1.2 var(--mono);color:#fff;direction:ltr;unicode-bidi:isolate}
.amt small{font-size:11px;color:var(--muted)}
.total-bar{position:fixed;z-index:19;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:calc(100% - 32px);max-width:428px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;border:1px solid var(--line-2);background:rgba(18,19,32,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.total-bar .amt b{font-size:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);color:#fff;font-size:15px;outline:none}
.field textarea{height:84px;padding:10px 14px;resize:vertical}
.field.flag input{border-color:rgba(245,184,91,.55)}
.flag-note{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--amber)}
.scan{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--surface)}
.scan-thumb{position:relative;flex-shrink:0;width:96px;height:124px;border-radius:10px;background:#EEF0F6;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scan-thumb img{width:100%;height:100%;object-fit:cover}
.scan-thumb .beam{position:absolute;left:0;right:0;height:2px;background:var(--accent2);box-shadow:0 0 12px 2px rgba(91,217,245,.8);animation:scan 2.8s ease-in-out infinite}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;border-radius:20px;border:1px dashed var(--accent-line);background:rgba(165,148,255,.05);color:var(--accent);text-align:center;cursor:pointer}
.toast{position:fixed;z-index:50;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:#1B1D2C;border:1px solid var(--line-2);color:#fff;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ---------- motion ---------- */
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.75);opacity:0}}
@keyframes blink{50%{opacity:.3}}
@keyframes flow{to{stroke-dashoffset:-30}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}
@keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- iPad / desktop ---------- */
@media (min-width:1024px){
  .app{padding:20px;gap:16px;align-items:flex-start}
  .sidebar{display:flex;position:sticky;top:20px;width:232px;flex-shrink:0;height:calc(100vh - 40px);flex-direction:column;gap:6px;padding:18px 12px;border-radius:26px;border:1px solid var(--line);background:var(--surface);z-index:1}
  .sidebar .brand-logo{width:132px;margin:4px auto 18px}
  .sidebar a{height:48px;padding:0 14px;border-radius:14px;display:flex;align-items:center;gap:12px;font-size:14px;color:#C7CBDD;text-decoration:none}
  .sidebar a[aria-current="page"]{background:rgba(165,148,255,.16);color:var(--accent);font-weight:600}
  .sidebar a.amber{color:var(--amber)}
  .sidebar a .badge{margin-right:auto;border:none}
  .sidebar hr{border:none;height:1px;margin:8px 14px;background:rgba(255,255,255,.08)}
  .sidebar .sys{margin-top:auto;display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03);font-size:12px;color:var(--muted)}
  .main{max-width:640px;padding:0 0 40px}
  .main.has-composer{padding-bottom:120px}
  .tabbar,.mobile-only{display:none!important}
  .side-chat{display:flex;position:sticky;top:20px;width:380px;flex-shrink:0;height:calc(100vh - 40px);flex-direction:column;gap:12px;padding:14px;border-radius:26px;border:1px solid var(--line);background:var(--surface);z-index:1}
  .side-chat .msgs{flex:1;overflow-y:auto}
  .side-chat .composer-dock{position:static;transform:none;width:100%}
  .composer-dock,.total-bar{bottom:20px;left:calc(50% - 72px);max-width:620px}
  body.with-side .composer-dock:not(.in-side),body.with-side .total-bar{left:calc(50% - 72px)}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="القائمة"></aside>
  <main class="main" id="view" tabindex="-1"></main>
  <section class="side-chat" id="sideChat" aria-label="محادثة المدير العام"></section>
</div>
<nav class="tabbar" id="tabbar" aria-label="التنقل الرئيسي"></nav>
<div id="dock"></div>
<div id="toastHost" aria-live="polite"></div>
<input type="file" id="invoiceInput" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-hidden="true">

  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/* ---- job-queue helpers: start* returns instantly with a jobId, the real
   server.js backend does the slow work in the background; poll until done.
   Mirrors the pattern already proven reliable on the effortless-cranachan
   frontend — needed because a single long-held request from the browser to
   this host is not reliable on Render's free tier. ---- */
async function startJobReq(path,opts){ const r=await http(path,opts); return r.jobId; }
async function pollJobReq(jobId,maxTries=150){
  for(let i=0;i<maxTries;i++){
    await wait(i<20?500:1200); // quick checks first: voice turns usually finish within seconds
    let job;
    try{ job=await http('/api/job/'+jobId); } catch { continue; }
    if(job.status==='done') return job.result;
    if(job.status==='error') throw new Error(job.error||'فشلت العملية');
  }
  throw new Error('استغرق الرد وقتًا طويلًا جدًا');
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const m=String(fr.result).match(/^data:(.+);base64,(.+)$/); if(!m){reject(new Error('read failed'));return;} resolve({mediaType:m[1],data:m[2]}); };
    fr.onerror=reject; fr.readAsDataURL(file);
  });
}
async function dataUrlToBase64(dataUrl){
  const m=String(dataUrl).match(/^data:(.+);base64,(.+)$/);
  if(!m) throw new Error('bad data url');
  return {mediaType:m[1],data:m[2]};
}

/* ---- shape translation: the real backend's /api/state + /api/status don't
   match this UI's expected shape 1:1 (that shape was designed against MOCK

const DEPT_META={

function splitBriefing(text){

function deptMeta(id){ return DEPT_META[id]||{name:id,icon:'gm',sources:[]}; }

  subscribe(){

let S=null;
const UI={openPay:null,payFilter:'all',period:'3m',deptFilter:'all',typing:null,draft:null,scanning:false,scanImg:null,newMode:'photo',sending:false,listening:false,pushStatus:null,openBooking:null,bookingDraft:null,voiceMode:false,speaking:false,transcribing:false};

/* ---- text-to-speech: reads the GM's replies aloud using the device's
   built-in voice (SpeechSynthesis — free, no external service). Picks an
   Arabic voice if the device has one installed; otherwise the default voice
   still reads the text, just possibly with non-Arabic pronunciation. ---- */
function pickArabicVoice(){
  const voices=window.speechSynthesis?speechSynthesis.getVoices():[];
  return voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ar'))||null;
}
/* ---- EchoNova Emirati voice (server-side, see /api/tts) with the device
   voice as an automatic fallback if EchoNova isn't configured or fails. ---- */
const SILENT_WAV="data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
const ttsAudio=new Audio();
ttsAudio.setAttribute('playsinline','');
function unlockAudio(){ try{ ttsAudio.src=SILENT_WAV; const p=ttsAudio.play(); if(p&&p.catch) p.catch(()=>{}); }catch{} }
// iOS also blocks speechSynthesis started outside a tap — prime it during the tap.
function unlockSpeech(){ try{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); } }catch{} }
function speakWithDevice(text,done){
  if(!('speechSynthesis' in window)||!text){ done(); return; }
  speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text.replace(/[*_#`]/g,''));
  const voice=pickArabicVoice(); if(voice) utter.voice=voice;
  utter.lang=voice?voice.lang:'ar-AE'; utter.rate=1;
  utter.onend=utter.onerror=done;
  // safety net: if Safari silently drops it, onend never fires — don't hang
  setTimeout(done,Math.min(30000,Math.max(4000,text.length*90)));
  speechSynthesis.speak(utter);
}
// Read a reply aloud with EchoNova in short pieces: the first sentence starts
// playing while the next piece is still being generated, so there's no long
// wait, and a long reply (like the briefing) never times out as one huge clip.
function speechChunks(text,max=220){
  const clean=String(text||'').replace(/[*_#`>|]/g,'').replace(/https?:\/\/\S+/g,'').replace(/\s*\n+\s*/g,'. ').replace(/\s+/g,' ').trim().slice(0,1500);
  const parts=clean.split(/(?<=[.!؟?،:;])\s+/), out=[]; let cur='';
  for(const p of parts){ const lim=out.length?max:110; /* short first piece → voice starts sooner */ if(cur&&(cur+' '+p).length>lim){ out.push(cur); cur=p; } else cur=cur?cur+' '+p:p; }
  if(cur) out.push(cur);
  return out.flatMap(c=>c.length<=max*1.6?[c]:c.match(new RegExp(`.{1,${max}}(\\s|$)`,'g'))||[c]).map(c=>c.trim()).filter(Boolean);
}
async function ttsChunk(text){
  const jobId=await startJobReq('/api/tts',{method:'POST',body:JSON.stringify({text})});
  const {audioUrl}=await pollJobReq(jobId,120);
  return audioUrl;
}
function playUrl(url){
  return new Promise((res,rej)=>{
    let t=null; const end=()=>{ clearTimeout(t); res(); };
    ttsAudio.onended=end; ttsAudio.onerror=()=>{ clearTimeout(t); rej(new Error('تعذّر تشغيل الصوت')); };
    ttsAudio.src=url;
    ttsAudio.play().then(()=>{ t=setTimeout(end,120000); }).catch(rej);
  });
}
async function speakText(text,onDone){
  if(!text){ onDone&&onDone(); return; }
  let finished=false;
  const done=()=>{ if(finished) return; finished=true; UI.speaking=false; render(true); onDone&&onDone(); };
  UI.speaking=true; render(true);
  if(S&&S.health&&S.health.echonova){
    const chunks=speechChunks(text);
    let i=0;
    try{
      let next=ttsChunk(chunks[0]);
      for(i=0;i<chunks.length;i++){
        const url=await next;
        if(!UI.voiceMode){ done(); return; } // call ended meanwhile
        next=i+1<chunks.length?ttsChunk(chunks[i+1]):null;
        if(next) next.catch(()=>{}); // handled when awaited
        await playUrl(url);
        if(!UI.voiceMode){ done(); return; }
      }
      done(); return;
    }catch(e){
      toast('تعذّر صوت Abdulla: '+String(e.message||e).slice(0,70));
      if(!UI.voiceMode){ done(); return; }
      speakWithDevice(chunks.slice(i).join(' '),done); // finish the rest with the device voice
      return;
    }
  }
  speakWithDevice(text,done);
}
function stopVoiceMode(){
  UI.voiceMode=false; UI.speaking=false;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  try{ ttsAudio.pause(); }catch{}
  stopVoiceInput(true);
  releaseMic();
  render(true);
}

/* ---- voice input (v4): records a short clip with MediaRecorder and sends it
   to the server (/api/stt → EchoNova Speech to Text). Replaces Safari's
   webkitSpeechRecognition, which never picked up audio on the iPad.
   Auto-stops after ~1.5s of silence; tapping the mic again stops it too. ---- */
const SpeechSupported=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let activeRecognition=null; // the live recorder session (name kept for the rest of the app)
let voiceRetries=0;
let micStream=null, micCtx=null;
// Call mode: the mic stream opened by the first tap stays open for the whole
// call, so every next turn starts listening on its own (no tap per reply),
// on iPad too. Recording only runs while the GM is NOT speaking (no echo).
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function pickRecMime(){
  for(const t of ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg']){
    try{ if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t)) return t; }catch{}
  }
  return '';
}
function releaseMic(){
  try{ micStream&&micStream.getTracks().forEach(t=>t.stop()); }catch{}
  micStream=null;
  try{ micCtx&&micCtx.close(); }catch{}
  micCtx=null;
}
async function startVoiceInput(inputId){
  if(!SpeechSupported||activeRecognition||UI.transcribing) return;
  UI.voiceAwaitTap=false;
  const session={stop:null,discard:false};
  activeRecognition=session; UI.listening=true; render(true);
  try{
    if(!micStream||!micStream.active) micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){
    activeRecognition=null; UI.listening=false;
    if(UI.voiceMode) stopVoiceMode();
    toast(e&&e.name==='NotAllowedError'?'اسمح بالميكروفون لهذا الموقع من إعدادات Safari':'تعذّر الوصول للميكروفون');
    render(true); return;
  }
  if(activeRecognition!==session) return; // cancelled while asking for the mic
  const mime=pickRecMime();
  let rec;
  try{ rec=mime?new MediaRecorder(micStream,{mimeType:mime}):new MediaRecorder(micStream); }
  catch{ activeRecognition=null; UI.listening=false; toast('تعذّر تشغيل التسجيل'); render(true); return; }
  const chunks=[];
  rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };

  // simple silence detection so the clip ends by itself after you stop talking
  let spoke=false, quietSince=0, timer=null;
  const startedAt=Date.now();
  const noSpeechMs=UI.voiceMode?10000:8000;
  let ctxOk=false;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      if(!micCtx||micCtx.state==='closed') micCtx=new AC();
      if(micCtx.state!=='running') await Promise.race([micCtx.resume().catch(()=>{}),new Promise(r=>setTimeout(r,400))]);
      ctxOk=micCtx.state==='running';
    }
  }catch{}
  if(activeRecognition!==session) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC&&ctxOk){
      const src=micCtx.createMediaStreamSource(micStream);
      const an=micCtx.createAnalyser(); an.fftSize=1024; src.connect(an);
      const buf=new Float32Array(an.fftSize);
      timer=setInterval(()=>{
        an.getFloatTimeDomainData(buf);
        let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
        const rms=Math.sqrt(sum/buf.length), now=Date.now();
        if(rms>0.02){ spoke=true; quietSince=0; }
        else if(spoke){ if(!quietSince) quietSince=now; else if(now-quietSince>1100) finish(); }
        if(!spoke&&now-startedAt>noSpeechMs){ session.discard=true; finish(); } // nothing said
        if(now-startedAt>60000) finish(); // hard cap per turn
      },120);
    }
  }catch{}

  function finish(){ clearInterval(timer); timer=null; if(rec.state!=='inactive'){ try{ rec.stop(); }catch{} } }
  session.stop=finish;
  // if the browser kept the audio analyser asleep, fall back to a fixed 8s clip
  if(!ctxOk) timer=setTimeout(finish,8000);

  rec.onstop=async()=>{
    clearInterval(timer);
    activeRecognition=null; UI.listening=false;
    if(!UI.voiceMode) releaseMic(); // in a call the mic stays open until the call ends
    const blob=new Blob(chunks,{type:(rec.mimeType||mime||'audio/mp4')});
    if(session.discard||blob.size<1500){
      if(UI.voiceMode){
        voiceRetries++;
        if(voiceRetries>=3){ voiceRetries=0; stopVoiceMode(); toast('انتهت المكالمة — ما سمعت شي'); return; }
        setTimeout(()=>{ if(UI.voiceMode&&!activeRecognition) startVoiceInput(inputId); },400);
      } else if(!session.discard){ toast('ما وصل صوت — حاول مرة ثانية'); }
      render(true); return;
    }
    UI.transcribing=true; render(true);
    let text='';
    try{
      const audio=await fileToBase64(blob);
      audio.mediaType=String(audio.mediaType||'audio/mp4').split(';')[0];
      const jobId=await startJobReq('/api/stt',{method:'POST',body:JSON.stringify({audio})});
      const res=await pollJobReq(jobId);
      text=(res&&res.text||'').trim();
    }catch(e){
      UI.transcribing=false;
      if(UI.voiceMode) stopVoiceMode();
      toast('تعذّر تحويل الصوت لنص: '+String(e.message||e).slice(0,80));
      render(true); return;
    }
    UI.transcribing=false;
    if(!text){
      if(UI.voiceMode){
        voiceRetries++;
        if(voiceRetries>=3){ voiceRetries=0; stopVoiceMode(); toast('انتهت المكالمة — ما سمعت شي'); return; }
        render(true); setTimeout(()=>{ if(UI.voiceMode&&!activeRecognition) startVoiceInput(inputId); },300); return;
      }
      toast('ما فهمت الكلام — حاول مرة ثانية');
      render(true); return;
    }
    voiceRetries=0;
    if(UI.voiceMode){
      const el=document.getElementById(inputId); if(el) el.value='';
      render(true); sendChat(text);
    } else {
      render(true);
      const el=document.getElementById(inputId);
      if(el){ el.value=(el.value?el.value+' ':'')+text; el.focus(); }
    }
  };
  try{ rec.start(); }
  catch{ clearInterval(timer); activeRecognition=null; UI.listening=false; toast('تعذّر تشغيل التسجيل'); render(true); }
}
function stopVoiceInput(discard){
  const s=activeRecognition; if(!s) return;
  if(discard) s.discard=true;
  if(s.stop) s.stop(); else { activeRecognition=null; UI.listening=false; } // still waiting for mic permission
}

function network(){
  const W=322,H=285,cx=161,cy=135,rx=108,ry=103;
  const ds=S.departments, n=ds.length;
  let lines='',nodes='';
  ds.forEach((d,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n, x=cx+rx*Math.cos(a)*-1, y=cy+ry*Math.sin(a);
    let st=d.state; if(offline()&&st!=='fail'&&st!=='idle') st='paused';
    const L=(cls,attrs)=>`<line ${attrs} class="${cls}"/>`;
    if(st==='out') lines+=L('flow-fast',`x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--accent2)" stroke-width="2"`);
    else if(st==='in') lines+=L('flow-fast',`x1="${x}" y1="${y}" x2="${cx}" y2="${cy}" stroke="var(--accent)" stroke-width="2"`);
    else if(st==='active') lines+=L('flow',`x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--accent)" stroke-opacity=".6" stroke-width="1.4"`);
    else if(st==='fail') lines+=L('',`x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--coral)" stroke-width="1.6" stroke-dasharray="4 4"`);
    else if(st==='paused') lines+=L('',`x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#4A4F66" stroke-width="1.3"`);
    else lines+=L('',`x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#3A3F55" stroke-width="1.2" stroke-dasharray="2 5"`);
    const cls=st==='active'?'':st;
    const count=st==='fail'?'!':d.tasks;
    const label=st==='fail'?`قسم ${d.name}، فشلت آخر مهمة`:`قسم ${d.name}، ${d.tasks} مهام`;
    nodes+=`<a class="node ${cls}" href="#${d.id==='accounting'?'accounting':'dept/'+d.id}" aria-label="${label}" style="right:${(x/W*100).toFixed(2)}%;top:${(y/H*100).toFixed(2)}%;transform:translate(50%,-22px)"><span class="disc">${ic(d.icon,'s18')}<span class="cnt">${count}</span></span><span class="lbl">${d.name}</span></a>`;
  });
  return `<div class="net ${offline()?'offline':''}"><svg class="lines" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><g transform="translate(${W},0) scale(-1,1)">${lines}</g></svg>
   <div class="core" style="right:${cx/W*100}%;top:${cy/H*100}%;transform:translate(50%,-50%)">${orb(58,!offline())}</div>${nodes}</div>`;
}

/* ----- home charts: Umrah prices vs competitors (monthly line), spending
   by category (donut), bookings by package type (donut). Data comes from
   /api/state (priceHistory is recorded monthly by the GM). ----- */
const AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const CHART_COLORS=['var(--accent)','var(--accent2)','var(--amber)','var(--mint)','var(--coral)','var(--muted)'];
function priceChart(){
  const pts=(S.priceHistory||[]).filter(p=>p&&p.month).slice(-12);
  const head=`<div class="topbar"><h2 class="h2">أسعار العمرة شهريًا</h2><button class="icon-btn" data-price-refresh aria-label="اطلب من المدير تسجيل نقطة هذا الشهر" ${UI.priceRefreshing?'disabled':''} style="border:none">${UI.priceRefreshing?'<span class="spin"></span>':ic('refresh')}</button></div>
   <div class="row" style="gap:14px;font-size:12px;color:var(--muted)"><span class="row" style="gap:6px"><span class="dot" style="background:var(--accent2);width:8px;height:8px"></span>أسعارنا</span><span class="row" style="gap:6px"><span class="dot" style="background:var(--coral);width:8px;height:8px"></span>متوسط المنافسين</span></div>`;
  const vals=pts.flatMap(p=>[p.ourAvg,p.competitorAvg]).filter(v=>typeof v==='number');
  if(!vals.length) return `<section class="card col" style="gap:12px;padding:16px;border-radius:22px">${head}<p class="sub" style="margin:0">${UI.priceRefreshing?'المدير يستشير المالية والاستراتيجية الحين…':'ما فيه نقاط مسجّلة بعد. المدير يسجّل نقطة كل شهر، أو اضغط ↻ عشان يسجّلها الحين.'}</p></section>`;
  const W=320,H=170,L=46,R=12,T=12,B=28;
  let lo=Math.min(...vals),hi=Math.max(...vals); const pad=(hi-lo)*0.15||hi*0.1||100; lo=Math.max(0,lo-pad); hi=hi+pad;
  const x=i=>pts.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(pts.length-1);
  const y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const grid=[0,.5,1].map(f=>{const v=lo+f*(hi-lo);return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" style="fill:var(--dim)">${fmt(Math.round(v))}</text>`}).join('');
  const series=(key,color)=>{
    const seg=[];let cur=[];
    pts.forEach((p,i)=>{ if(typeof p[key]==='number') cur.push(`${x(i)},${y(p[key])}`); else if(cur.length){seg.push(cur);cur=[];} });
    if(cur.length) seg.push(cur);
    return seg.map(s=>`<polyline points="${s.join(' ')}" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="stroke:${color}"/>`).join('')
      +pts.map((p,i)=>typeof p[key]==='number'?`<circle cx="${x(i)}" cy="${y(p[key])}" r="3.5" style="fill:${color}"><title>${fmt(p[key])} د.إ</title></circle>`:'').join('');
  };
  const labels=pts.map((p,i)=>{const m=+String(p.month).split('-')[1];return (pts.length<=6||i%2===0||i===pts.length-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" style="fill:var(--dim)">${AR_MONTHS[m-1]||p.month}</text>`:''}).join('');
  const last=pts[pts.length-1];
  const diff=(typeof last.ourAvg==='number'&&typeof last.competitorAvg==='number'&&last.competitorAvg)?Math.round((last.ourAvg-last.competitorAvg)/last.competitorAvg*100):null;
  return `<section class="card col" style="gap:12px;padding:16px;border-radius:22px">${head}
   <div class="ltr" style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="رسم أسعار العمرة مقارنة بالمنافسين">${grid}${series('competitorAvg','var(--coral)')}${series('ourAvg','var(--accent2)')}${labels}</svg></div>
   ${diff===null?'':`<p class="sub" style="margin:0">آخر شهر: أسعارنا ${diff===0?'مساوية لمتوسط المنافسين':`${diff>0?'أعلى':'أقل'} من متوسط المنافسين بـ <b class="ltr" style="color:${diff>0?'var(--coral)':'var(--mint)'}">${Math.abs(diff)}%</b>`}</p>`}</section>`;
}
function donut(segs,centerTop,centerSub){
  const total=segs.reduce((s,x)=>s+x.value,0); const r=42,C=2*Math.PI*r; let off=0;
  const arcs=segs.map(sg=>{const len=total?sg.value/total*C:0; const a=`<circle cx="60" cy="60" r="${r}" fill="none" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)" style="stroke:${sg.color}"><title>${esc(sg.label)}</title></circle>`; off+=len; return a;}).join('');
  return `<svg viewBox="0 0 120 120" width="132" height="132" style="flex-shrink:0" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke-width="16" style="stroke:var(--surface-2)"/>${arcs}<text x="60" y="58" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--text-strong)">${centerTop}</text><text x="60" y="75" text-anchor="middle" font-size="9" style="fill:var(--dim)">${centerSub}</text></svg>`;
}

}

function normPkgKey(n){

    .replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');

function pkgName(n){

function profitChart(){
  const bks=S.bookings||[]; if(!bks.length) return '';

function monthlyChart(){

async function toggleBriefingAudio(){
  if(UI.briefAudio){ try{ ttsAudio.pause(); }catch{} if('speechSynthesis' in window) speechSynthesis.cancel(); UI.briefAudio=null; render(true); return; }
  const text=S.briefingText||(S.briefing.top||[]).join('. ');
  if(!text){ toast('ما فيه إحاطة لليوم'); return; }
  unlockAudio(); unlockSpeech(); // must run inside the tap on iPad
  const done=()=>{ UI.briefAudio=null; render(true); };
  if(S.health&&S.health.echonova){
    UI.briefAudio='loading'; render(true);
    try{
      const jobId=await startJobReq('/api/tts',{method:'POST',body:JSON.stringify({text})});
      const {audioUrl}=await pollJobReq(jobId);
      if(UI.briefAudio!=='loading') return; // stopped while generating
      UI.briefAudio='playing'; render(true);
      ttsAudio.onended=ttsAudio.onerror=done; ttsAudio.src=audioUrl; await ttsAudio.play();
      return;
    }catch(e){ toast('تعذّر صوت EchoNova — بصوت الجهاز'); }

}

async function sendChat(text,image){
  if(!text&&!image) return;
  S.chat.push({me:true,text,image}); UI.sending=true;
  UI.typing=image?'المحاسبة تقرأ الفاتورة…':'المدير يراجع طلبك…'; render(true);
  let replyText=null;
  try{ const res=await API.sendMessage(text,image); S.chat.push({me:false,...res}); replyText=res.reply; }
  catch(e){ const msg='تعذّر الوصول للمدير العام. تحقق من اتصال السيرفر ثم أعد الإرسال.'; S.chat.push({me:false,reply:msg}); replyText=msg; }
  UI.typing=null; UI.sending=false; render(true);
  if(UI.voiceMode&&replyText){
    speakText(replyText,()=>{ if(!UI.voiceMode) return; startVoiceInput('msg'); });
  }
}
function bindChat(root){
  root.querySelectorAll('[data-chat-form]').forEach(f=>f.onsubmit=e=>{e.preventDefault();if(UI.sending){toast('انتظر رد المدير، وكلامك باقي بالخانة');return}const inp=f.querySelector('input');const t=inp.value.trim();if(!t)return;inp.value='';sendChat(t)});
  root.querySelectorAll('[data-suggest]').forEach(b=>b.onclick=()=>sendChat(b.dataset.suggest));
  root.querySelectorAll('[data-attach]').forEach(b=>b.onclick=()=>{UI.attachTarget='chat';document.getElementById('invoiceInput').click()});
  root.querySelectorAll('[data-mic]').forEach(b=>b.onclick=()=>{ if(UI.listening){ stopVoiceInput(); } else { if(UI.voiceMode){ unlockAudio(); unlockSpeech(); } UI.voiceAwaitTap=false; startVoiceInput('msg'+b.dataset.mic); } });
  root.querySelectorAll('[data-voice-mode]').forEach(b=>b.onclick=()=>{
    if(UI.voiceMode){ stopVoiceMode(); }
    else { unlockAudio(); unlockSpeech(); UI.voiceMode=true; render(true); startVoiceInput('msg'+b.dataset.voiceMode); }
  });
  root.querySelectorAll('[data-confirm-draft]').forEach(b=>b.onclick=async()=>{const m=S.chat[+b.dataset.confirmDraft];const p=m.paymentDraft;if(!p.amount){UI.draft={...p};UI.newMode='manual';go('new-payment');return}const saved=await API.addPayment(stripDraft(p));S.payments.unshift(saved);p.saved=true;toast('تم تسجيل الدفعة');render(true)});
  root.querySelectorAll('[data-edit-draft]').forEach(b=>b.onclick=()=>{UI.draft={...S.chat[+b.dataset.editDraft].paymentDraft};UI.newMode='manual';go('new-payment')});
  const m=root.querySelector('.msgs'); if(m&&root.id==='sideChat') m.scrollTop=m.scrollHeight;
}

/* ----- accounting ----- */
function inPeriod(d){const days=(new Date(iso(0))-new Date(d))/864e5;return UI.period==='1m'?days<=31:UI.period==='3m'?days<=92:UI.period==='1y'?days<=366:true}
function viewAccounting(){
  const scoped=S.payments.filter(p=>inPeriod(p.date));
  const list=scoped.filter(p=>UI.payFilter==='all'||p.cat===UI.payFilter).sort((a,b)=>b.date.localeCompare(a.date));
  const total=list.reduce((s,p)=>s+Number(p.amount),0), all=scoped.reduce((s,p)=>s+Number(p.amount),0)||1;
  const byCat=Object.keys(CATS).map(k=>[k,scoped.filter(p=>p.cat===k).reduce((s,p)=>s+Number(p.amount),0)]).filter(x=>x[1]>0);
  const groups={}; list.forEach(p=>{const k=p.date.slice(0,7);(groups[k]=groups[k]||[]).push(p)});
  const periodLabel={'1m':'آخر شهر','3m':'آخر 3 أشهر','1y':'آخر سنة','all':'كل الفترات'}[UI.period];
  const row=p=>{const c=CATS[p.cat]||CATS.other,open=UI.openPay===p.id;return `<div class="pay ${open?'open':''}"><button aria-expanded="${open}" data-pay="${p.id}"><span class="tile" style="background:${c.soft};color:${c.color}">${ic(p.cat in ICONS?p.cat:'other','s18')}</span><span class="grow col" style="gap:2px"><b style="font-size:14px;color:#fff">${esc(p.title)}</b><span class="sub">${c.label} · ${dfmt(p.date,{day:'numeric',month:'long'})}</span></span>${amt(p.amount)}<span class="chev">${ic('down','s16')}</span></button>
   ${open?`<div class="pay-detail"><div class="kv"><span>تاريخ الدفع</span><span>${dfmt(p.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span></div><div class="kv"><span>الجهة المستفيدة</span><span>${esc(p.payee||'—')}</span></div><div class="kv"><span>الفئة</span><span>${c.label}</span></div><div class="kv"><span>طريقة الدفع</span><span>${esc(p.method||'—')}</span></div><div class="kv"><span>رقم الفاتورة</span><span class="mono">${esc(p.invoice||'—')}</span></div>
   ${p.notes?`<div class="col" style="gap:4px;padding:8px 0"><span class="sub" style="font-size:13px">ملاحظات</span><span style="font-size:13px;line-height:1.7">${esc(p.notes)}</span></div>`:''}
   ${p.image?`<img src="${p.image}" alt="صورة الفاتورة" style="width:100%;border-radius:12px;margin-top:6px">`:''}
   <div class="row" style="gap:8px;margin-top:10px"><a class="btn outline grow" href="${API_BASE}/api/payments/${p.id}/invoice" target="_blank" rel="noopener">${ic('doc','s16')}فاتورة PDF</a><button class="btn outline grow" data-edit-pay="${p.id}">${ic('pen','s16')}تعديل</button><button class="btn danger grow" data-del-pay="${p.id}">${ic('trash','s16')}حذف</button></div></div>`:''}</div>`};
  return `<header class="back-head"><a class="icon-btn" href="#depts" aria-label="رجوع">${ic('back')}</a><div class="grow col" style="gap:1px"><h1 class="h1">المحاسبة</h1><span class="sub">سجل المدفوعات</span></div><a class="btn primary" href="#new-payment" data-new-pay>${ic('plus','s16')}دفعة جديدة</a></header>
  <section class="card col" style="gap:12px;padding:16px" aria-label="توزيع المصاريف"><div class="topbar"><b style="font-size:13px;color:#fff">توزيع المصاريف</b>
   <label class="sr" for="period">الفترة</label><select id="period" data-period style="height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);color:#D9DCE8;font-size:12px">${[['1m','آخر شهر'],['3m','آخر 3 أشهر'],['1y','آخر سنة'],['all','كل الفترات']].map(([k,l])=>`<option value="${k}" ${UI.period===k?'selected':''}>${l}</option>`).join('')}</select></div>
   ${byCat.length?`<div class="catbar" aria-hidden="true">${byCat.map(([k,v])=>`<span style="width:${Math.max(v/all*100,1.5)}%;background:${CATS[k].color}"></span>`).join('')}</div><div class="legend">${byCat.map(([k,v])=>`<div><span class="dot" style="border-radius:2px;background:${CATS[k].color}"></span><span class="grow" style="color:#D9DCE8">${CATS[k].label}</span><span class="mono ltr" style="color:#fff">${fmt(v)}</span></div>`).join('')}</div>`:'<span class="sub">لا توجد مدفوعات في هذه الفترة.</span>'}</section>

  ${list.length?Object.entries(groups).map(([m,ps])=>`<div class="col" style="gap:8px"><div class="sec-head"><h2 class="h2">${dfmt(m+'-01',{month:'long',year:'numeric'})}</h2><span class="sub">${ps.length} ${ps.length===1?'دفعة':'مدفوعات'}</span></div>${ps.map(row).join('')}</div>`).join('')
   :`<div class="empty">ما فيه مدفوعات هنا. سجّل أول دفعة من زر "دفعة جديدة"، أو أرسل صورة الفاتورة للمدير العام.</div>`}
  <div class="total-bar" role="status" aria-live="polite"><div class="grow col" style="gap:1px"><b style="font-size:14px;color:#fff">المبلغ الإجمالي</b><span class="sub">${list.length} ${list.length===1?'دفعة':'مدفوعات'} · ${periodLabel}${UI.payFilter!=='all'?' · '+CATS[UI.payFilter].label:''}</span></div>${amt(total)}</div>`;
}
function viewNewPayment(){

    :`<button class="drop" data-scan>${ic('cam')}<b style="font-size:15px">صوّر الفاتورة أو اختر صورة</b><span class="sub">المحاسبة تقرأ البيانات وتعبّي الخانات</span></button>`):''}
  <form class="col" style="gap:14px" data-pay-form>
   ${fld('f-amt','المبلغ (د.إ)','amount','number','inputmode="decimal" step="0.01" min="0" required')}

   ${fld('f-date','تاريخ الدفع','date','date','required')}
   <div class="field ${flag('method')?'flag':''}"><div class="topbar"><label for="f-method">طريقة الدفع</label>${flag('method')?`<span class="flag-note">${ic('warn','s14')}غير واضحة في الفاتورة</span>`:''}</div><select id="f-method" data-f="method"><option value="">اختر</option>${METHODS.map(m=>`<option ${d.method===m?'selected':''}>${m}</option>`).join('')}</select></div>

  const list=(S.bookings||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));

  const row=b=>{
    const open=UI.openBooking===b.id;
    const docs=b.docs||{passport:false,photo:false,visa:false};
    const missing=Object.entries(docs).filter(([,v])=>!v).length;
    return `<div class="pay ${open?'open':''}"><button aria-expanded="${open}" data-booking="${b.id}">
      <span class="tile" style="background:var(--mint-soft,rgba(52,211,153,.12));color:var(--mint)">${ic('check','s18')}</span>

      ${amt(b.amount)}<span class="chev">${ic('down','s16')}</span></button>
     ${open?`<div class="pay-detail">

function isTyping(){
  const a=document.activeElement;
  return !!(a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['button','submit','checkbox','radio','file'].includes(a.type))));
}
function render(keepScroll){
  // remember what's typed (and where the cursor is) so a redraw never wipes it
  const keep=[...document.querySelectorAll('input[id],textarea[id]')].filter(el=>el.type!=='file'&&el.value).map(el=>[el.id,el.value]);
  const a=document.activeElement, focusId=a&&a.id&&isTyping()?a.id:null;
  let selS=null,selE=null; try{ if(focusId){ selS=a.selectionStart; selE=a.selectionEnd; } }catch{}
  const routeBefore=location.hash;
  _render(keepScroll);
  if(location.hash!==routeBefore) return;
  keep.forEach(([id,val])=>{ const el=document.getElementById(id); if(el&&!el.value) el.value=val; });
  if(focusId){ const el=document.getElementById(focusId); if(el&&document.activeElement!==el){ el.focus({preventScroll:true}); try{ if(selS!=null) el.setSelectionRange(selS,selE); }catch{} } }
}

/* ---- push notifications: service worker + subscribe/unsubscribe ---- */
function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function getPushSubscriptionStatus(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)) return 'unsupported';
  const reg=await navigator.serviceWorker.ready.catch(()=>null);
  if(!reg) return 'unsupported';
  const sub=await reg.pushManager.getSubscription();
  return sub?'subscribed':'not-subscribed';
}
async function enablePushNotifications(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){ toast('الإشعارات غير مدعومة على هذا المتصفح'); return false; }
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast('لم يتم السماح بالإشعارات'); return false; }
    const {publicKey}=await http('/api/push/vapid-public-key');
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(publicKey)});
    await http('/api/push/subscribe',{method:'POST',body:JSON.stringify(sub)});
    toast('تم تفعيل الإشعارات');
    return true;
  }catch(e){ toast('تعذّر تفعيل الإشعارات'); return false; }
}
async function disablePushNotifications(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){ await http('/api/push/unsubscribe',{method:'POST',body:JSON.stringify({endpoint:sub.endpoint})}); await sub.unsubscribe(); }
    toast('تم إيقاف الإشعارات');
  }catch{}
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
getPushSubscriptionStatus().then(s=>{ UI.pushStatus=s; render(true); }).catch(()=>{ UI.pushStatus='unsupported'; });

render(); load();
</script>
